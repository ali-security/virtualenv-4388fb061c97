name: 🧪 check
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "pytest selector (e.g. tests/unit/test_util.py); empty runs the full suite"
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_EXCLUDE_NEWER: "2026-10-16T01:00:00Z"
  # pip's own upload-date cutoff, not PIP_INDEX_URL: virtualenv treats PIP_INDEX_URL as a custom index and skips the
  # PyPI digest check that tests/unit/seed/wheels/test_acquire.py::test_download_wheel_verifies_digest asserts
  PIP_UPLOADED_PRIOR_TO: "2026-10-16T01:00:00Z"
permissions: {}
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} - ${{ matrix.os }} ${{ matrix.group }}
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.py == 'graalpy' && 20 || 40 }}
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13t"
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
          - "3.9"
          - pypy-3.11
          - pypy-3.10
          - pypy-3.9
          - rp
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025-vs2026
        include:
          - {os: windows-2025-vs2026, py: "3.13t", diagnostics: true}
          - {os: macos-26, py: "3.13t", diagnostics: true}
          - {os: ubuntu-24.04, py: graalpy, group: "1/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "2/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "3/4"}
          - {os: ubuntu-24.04, py: graalpy, group: "4/4"}
          - {os: macos-26, py: graalpy, group: "1/4"}
          - {os: macos-26, py: graalpy, group: "2/4"}
          - {os: macos-26, py: graalpy, group: "3/4"}
          - {os: macos-26, py: graalpy, group: "4/4"}
          - {os: macos-26, py: "brew@3.14"}
          - {os: macos-26, py: "brew@3.13"}
          - {os: macos-26, py: "brew@3.12"}
          - {os: macos-26, py: "brew@3.11"}
          - {os: macos-26, py: "brew@3.10"}
        exclude:
          - {os: windows-2025-vs2026, py: "pypy-3.10"}
          - {os: windows-2025-vs2026, py: "pypy-3.9"}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ Fetch upstream tags for versioning
        shell: bash
        run: |
          git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: Check out activate.xsh with LF endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        # .gitattributes pins eol=lf for the other POSIX activators but not *.xsh, so the runner's autocrlf checkout
        # bakes CRLF into the xonsh template and test_xonsh's LF assertion fails; the released (Linux-built) wheel ships
        # it with LF, so re-check it out that way through the untracked per-clone attributes file.
        run: |
          echo "*.xsh text eol=lf" >> .git/info/attributes
          rm src/virtualenv/activation/xonsh/activate.xsh
          git checkout -- src/virtualenv/activation/xonsh/activate.xsh
          git status --porcelain
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: ${{ matrix.py }}
          python-version: "3.15"
          activate-environment: true
      - name: 📦 Install tox with this virtualenv
        shell: bash
        env:
          MATRIX_PY: ${{ matrix.py }}
        run: |
          if [[ "$MATRIX_PY" == "3.13t" || "$MATRIX_PY" == "3.14t" || "$MATRIX_PY" == "3.15t" || "$MATRIX_PY" == "rp" ]]; then
            uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with .
          else
            uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv --with .
          fi
      - name: 🧮 Resolve GraalPy release
        id: graalpy
        if: matrix.py == 'graalpy'
        shell: bash
        # the upgrade workflow keeps tasks/ci-tools.json on the newest release
        run: echo "python-version=graalpy-$(jq --raw-output '.graalpy.tag | ltrimstr("graal-")' tasks/ci-tools.json)" >> "$GITHUB_OUTPUT"
      - name: 🐍 Setup Python for test ${{ matrix.py }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !startsWith(matrix.py, 'brew@') && !startsWith(matrix.py, '3.15') && matrix.py != 'rp' }}
        with:
          python-version: ${{ steps.graalpy.outputs.python-version || matrix.py }}
          allow-prereleases: true
      - name: Setup Python 3.15 for tests
        if: startsWith(matrix.py, '3.15')
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: ${{ matrix.py }}
          activate-environment: true
      - name: 🦀 Setup RustPython
        if: matrix.py == 'rp'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the upgrade workflow keeps tasks/ci-tools.json on the newest release; tr drops the CR jq.exe may emit
          read -r tag asset sha256 < <(jq --raw-output --arg os "$RUNNER_OS" \
            '.rustpython | [.tag, .assets[$os].name, .assets[$os].sha256] | @tsv' tasks/ci-tools.json | tr -d '\r')
          gh release download "$tag" --repo RustPython/RustPython --pattern "$asset" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && echo "$sha256  $asset" | sha256sum -c -)
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$RUNNER_TEMP/$asset" "/c/ProgramData/chocolatey/bin/rustpython.exe"
          else
            chmod +x "$RUNNER_TEMP/$asset"
            sudo mv "$RUNNER_TEMP/$asset" /usr/local/bin/rustpython
          fi
      - name: 🛠️ Install OS dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_PY: ${{ matrix.py }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            retry() {
              local n=1
              while ! "$@"; do
                if [ $n -ge 5 ]; then
                  echo "Command failed after $n attempts: $*" >&2
                  return 1
                fi
                echo "Attempt $n failed for: $*; retrying in 10s" >&2
                n=$((n + 1))
                sleep 10
              done
            }
            retry sudo apt-get install -y software-properties-common
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://apt.fury.io/nushell/gpg.key \
              | sudo gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
            sudo chmod 0644 /etc/apt/keyrings/fury-nushell.gpg
            echo "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" \
              | sudo tee /etc/apt/sources.list.d/fury.list
            retry sudo apt-get update -y
            retry sudo apt-get install snapd nushell -y
            # Canonical hosts (archive/security.ubuntu.com, Launchpad PPA) are unreachable from the fork's runners:
            # take fish 4.9.3 (newest at the 21.14.8 release) from its GitHub release and csh from the Debian pool.
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/fish.tar.xz" \
              https://github.com/fish-shell/fish-shell/releases/download/4.9.3/fish-4.9.3-linux-x86_64.tar.xz
            echo "8f643d10ad1abb0ef7072764c01ceb5cf61b2d373fda400cf60f0bad69b7e095  $RUNNER_TEMP/fish.tar.xz" | sha256sum -c -
            sudo tar -xJf "$RUNNER_TEMP/fish.tar.xz" -C /usr/local/bin fish
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/csh.deb" \
              http://deb.debian.org/debian/pool/main/c/csh/csh_20240808-4_amd64.deb
            echo "d9e4ba4246ab33da26be3d1689e0faedc460a0ef7a671c330daf3500e937ceff  $RUNNER_TEMP/csh.deb" | sha256sum -c -
            sudo dpkg -i "$RUNNER_TEMP/csh.deb"
            # zsh (test_bash.py zsh prompt cases) and tcsh (test_csh.py) are not preinstalled; take them from the
            # Debian trixie pool for the same reason as csh above (their deps are all present on ubuntu-24.04).
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/zsh-common.deb" \
              http://deb.debian.org/debian/pool/main/z/zsh/zsh-common_5.9-8_all.deb
            echo "400c958c7fdb66a945cad32c0edc81cedcfface0059b5e2beb46097a457099bd  $RUNNER_TEMP/zsh-common.deb" | sha256sum -c -
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/zsh.deb" \
              http://deb.debian.org/debian/pool/main/z/zsh/zsh_5.9-8+b24_amd64.deb
            echo "69791a2e667258a54449cfa01ad0d8d198a4c6e27f02f21c864d0545efe18966  $RUNNER_TEMP/zsh.deb" | sha256sum -c -
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/tcsh.deb" \
              http://deb.debian.org/debian/pool/main/t/tcsh/tcsh_6.24.13-2_amd64.deb
            echo "30234574fb7fa86cd25c28ae990f34b1109deccdbc78ccf477543dd48e79cb91  $RUNNER_TEMP/tcsh.deb" | sha256sum -c -
            sudo dpkg -i "$RUNNER_TEMP/zsh-common.deb" "$RUNNER_TEMP/zsh.deb" "$RUNNER_TEMP/tcsh.deb"
            fish --version
            zsh --version
            tcsh --version
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew update
            if [[ "$MATRIX_PY" == brew@* ]]; then
              PY=$(echo "$MATRIX_PY" | cut -c 6-)
              brew list --versions "python@$PY" >/dev/null 2>&1 || brew install "python@$PY"
              echo "/usr/local/opt/python@$PY/libexec/bin" >>"${GITHUB_PATH}"
            fi
            # bash: macOS ships bash 3.2, and test_bash.py's ${PS1@P} prompt cases need bash 4.4 or later
            brew install fish tcsh nushell bash || brew upgrade fish tcsh nushell bash
            bash --version
          elif [ "$RUNNER_OS" = "Windows" ]; then
            read -r nu_tag nu_archive nu_sha256 < <(jq --raw-output \
              '.nushell | [.tag, .assets.Windows.name, .assets.Windows.sha256] | @tsv' tasks/ci-tools.json | tr -d '\r')
            gh release download "$nu_tag" --repo nushell/nushell --pattern "$nu_archive" --dir "$RUNNER_TEMP"
            (cd "$RUNNER_TEMP" && echo "$nu_sha256  $nu_archive" | sha256sum -c -)
            7z x "$RUNNER_TEMP/$nu_archive" -o"$RUNNER_TEMP/nushell" -y
            cp "$RUNNER_TEMP/nushell/nu.exe" "/c/ProgramData/chocolatey/bin/nu.exe"
          fi
          # test_xonsh.py::test_xonsh needs a xonsh executable on PATH; install it as a uv tool (UV_EXCLUDE_NEWER
          # resolves the release-era version) so the xonsh activator is exercised on every leg.
          uv tool install --python-preference only-managed --python 3.13 xonsh
          xonsh --version
      - name: 🧬 Pick environment to run
        shell: bash
        env:
          MATRIX_PY: ${{ matrix.py }}
        run: |
          py="$MATRIX_PY"
          if [[ "$py" == brew@* ]]; then
            brew_version="${py#brew@}"
            echo "UV_PYTHON=/opt/homebrew/bin/python${brew_version}" >> "$GITHUB_ENV"
            py="$brew_version"
          fi
          echo "TOXENV=$py" >> "$GITHUB_ENV"
          echo "Set TOXENV=$py"
      - name: 🏗️ Setup test suite
        run: tox run -vvvv --notest --skip-missing-interpreters false
      - name: 🔎 Verify pytest diagnostics
        if: matrix.diagnostics
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_path=./.tox/3.13t/Scripts/python.exe
          else
            python_path=./.tox/3.13t/bin/python
          fi
          "$python_path" -m pytest tests/tasks/test_pytest_diagnostics.py -n 0 --basetemp=.tox/diagnostics-self-test
      - name: 🏃 Run test suite
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            case "$TOXENV" in
              # these envs run pytest without the coverage report gate; keep their default --skip-slow
              graalpy)
                tox run --skip-pkg-install -- ${{ inputs.test-filter }} --skip-slow
                ;;
              rp)
                tox run --skip-pkg-install -- --junitxml ".tox/junit.$TOXENV.xml" ${{ inputs.test-filter }} --skip-slow
                ;;
              *)
                # a scoped run cannot reach the full-suite coverage fail_under gate, so call the env's pytest directly
                if [ "$RUNNER_OS" = "Windows" ]; then env_bin="$PWD/.tox/$TOXENV/Scripts"; else env_bin="$PWD/.tox/$TOXENV/bin"; fi
                VIRTUAL_ENV="$PWD/.tox/$TOXENV" PATH="$env_bin:$PATH" "$env_bin/python" -m pytest \
                  --junitxml ".tox/junit.$TOXENV.xml" -n auto ${{ inputs.test-filter }}
                ;;
            esac
          else
            tox run --skip-pkg-install
          fi
        timeout-minutes: ${{ matrix.py == 'graalpy' && 17 || 30 }}
        env:
          GRAALPY_GROUP: ${{ matrix.group || '1/1' }}
          PYTEST_PLUGINS: ${{ matrix.diagnostics && 'tasks.pytest_diagnostics' || '' }}
          # --reruns lets a single test recover from a transient worker crash (see
          # pytest-rerunfailures' documented pytest-xdist crash-recovery support) instead of
          # failing the whole matrix leg; scoped to CI only so local runs still fail fast.
          # graalpy skips xdist: tasks/run_graalpy_tests.py runs one serial pytest process per
          # CPU instead, each on its own --shard slice of the tests. graalpy also dropped its
          # --timeout-method=thread override: that method spawns a watcher thread per test,
          # and GraalVM's Context.close() treats any Python-visible thread still alive as
          # fatal, crashing the job even after every test passed (see #3240). The default
          # signal-based method needs no such thread. --timeout=300 stays as a safety net.
          PYTEST_ADDOPTS: "-vv -rs --durations=20 --reruns 2 --reruns-delay 2${{ matrix.py == 'graalpy' && ' --timeout=300' || '' }}"
          # If a worker process dies outright (seen on 3.13t/Windows with no Python-level
          # exception at all), this prints a native stack trace to stderr instead of nothing.
          PYTHONFAULTHANDLER: "1"
          CI_RUN: "yes"
          DIFF_AGAINST: HEAD
      - name: Report skipped tests with their reasons
        if: always()
        shell: bash
        # the -rs summary sits deep inside a long log; restate every skipped test and its reason from the junit
        # reports as one compact block at the end of the job log
        run: |
          uv run --no-project --python-preference only-managed --python 3.15 python -I - .tox/junit.*.xml <<'EOF'
          import sys, collections, xml.etree.ElementTree as ET
          by_reason, total = collections.defaultdict(list), collections.Counter()
          for path in sys.argv[1:]:
              for case in ET.parse(path).getroot().iter("testcase"):
                  outcome = "passed"
                  for child in case:
                      if child.tag in ("failure", "error", "skipped"):
                          outcome = child.tag
                          if child.tag == "skipped":
                              reason = (child.get("message") or "").strip() or "(no reason)"
                              by_reason[reason].append(f"{case.get('classname')}::{case.get('name')}")
                  total[outcome] += 1
          print(f"junit totals: {dict(total)}")
          for reason, tests in sorted(by_reason.items(), key=lambda kv: -len(kv[1])):
              print(f"SKIPPED [{len(tests)}] {reason}: {', '.join(sorted(set(tests)))}")
          EOF
      - name: 📤 Store macOS crash reports
        if: always() && matrix.diagnostics && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports-${{ matrix.py }}-${{ matrix.os }}
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 14
      - name: 📤 Store pytest diagnostics
        if: always() && matrix.diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-diagnostics-${{ matrix.py }}-${{ matrix.os }}
          path: |
            .tox/hang-diagnostics/
            .tox/diagnostics-self-test/**/diagnostics/*.log
            .tox/3.13t/log/
            .tox/junit.3.13t.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: 📤 Store coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.py }}-${{ matrix.os }}-${{ strategy.job-index }}
          # combined .coverage.<env> files and the per-process files of envs that do not combine them
          path: .tox/.coverage*
          include-hidden-files: true
          # a scoped run calls pytest outside coverage
          if-no-files-found: ${{ inputs.test-filter != '' && 'ignore' || 'error' }}
          retention-days: 1
  coverage:
    name: 📊 coverage
    needs: test
    # the coverage gate measures the full suite, so a scoped run skips it
    if: (github.event_name != 'schedule' || github.repository_owner == 'pypa') && inputs.test-filter == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the sources the report reads
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: coverage
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 📥 Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # one directory per test run: runs on different OSes write the same .coverage.<env> file name
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-data
      - name: 📊 Combine and report coverage
        run: tox run -e coverage -- "$RUNNER_TEMP"/coverage-data/*
      - name: 📝 Write the coverage summary
        run: .tox/coverage/bin/coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_FILE: .tox/.coverage
  check:
    name: 🔎 check ${{ matrix.tox_env }} - ${{ matrix.os }}
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
        tox_env:
          - dev
          - property
          - fuzz
          - tasks
          - zipapp
        exclude:
          - {os: windows-2025-vs2026, tox_env: fuzz}
          - {os: windows-2025-vs2026, tox_env: tasks}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🏷️ Fetch upstream tags for versioning
        shell: bash
        run: |
          git fetch --force --tags https://github.com/pypa/virtualenv.git
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: ${{ matrix.tox_env }}
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 "tox>=4.45" --with tox-uv
      - name: 🏗️ Setup check suite
        run: tox run -vv --notest --skip-missing-interpreters false
        env:
          TOXENV: ${{ matrix.tox_env }}
      - name: 🏃 Run check for ${{ matrix.tox_env }}
        run: tox run --skip-pkg-install
        env:
          TOXENV: ${{ matrix.tox_env }}
          PYTEST_ADDOPTS: "-rs"
          UPGRADE_ADVISORY: ${{ matrix.tox_env == 'upgrade' && '1' || '' }}
  test-queries:
    name: 🔎 test custom queries
    if: github.event_name != 'schedule' || github.repository_owner == 'pypa'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the queries and their test fixtures
      security-events: read # codeql-action needs it to reach its API endpoints
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🔎 Install CodeQL
        id: codeql
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
      - name: 🏃 Run query tests
        run: '"$CODEQL" test run .github/codeql/tests'
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
  all-checks-pass:
    name: ✅ all checks pass
    # the gate shares the jobs' condition, so every job it needs has run and a skip counts as a failure
    if: always() && (github.event_name != 'schedule' || github.repository_owner == 'pypa')
    needs: [test, coverage, check, test-queries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: ✅ Require every job to succeed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: ${{ inputs.test-filter != '' && 'coverage' || '' }}
          jobs: ${{ toJSON(needs) }}
